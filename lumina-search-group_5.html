<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina Search Group — Executive Search for PE-Backed AI Companies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #B8995A;
    --gold-light: #D4B97A;
    --gold-pale: #F5EDD8;
    --ink: #0E0E0D;
    --ink-soft: #2A2A28;
    --ink-muted: #6B6A66;
    --cream: #FAF8F3;
    --cream-dark: #F0EDE4;
    --white: #FFFFFF;
    --rule: rgba(184,153,90,0.25);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.4rem 4rem;
    background: rgba(250,248,243,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
    transition: padding 0.3s ease;
  }

  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
  }

  .nav-logo span { color: var(--gold); }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink-muted);
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--gold); }

  .nav-cta {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    border: 1px solid var(--gold);
    padding: 0.6rem 1.4rem;
    transition: background 0.2s, color 0.2s;
  }

  .nav-cta:hover { background: var(--gold); color: var(--white); }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
    padding-top: 80px;
  }

  .hero-left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6rem 4rem 6rem 4rem;
    position: relative;
    z-index: 2;
  }

  .hero-eyebrow {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .hero-eyebrow::before {
    content: '';
    display: block;
    width: 32px;
    height: 1px;
    background: var(--gold);
  }

  .hero-headline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3.2rem, 5vw, 5.5rem);
    font-weight: 300;
    line-height: 1.06;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 2.5rem;
  }

  .hero-headline em {
    font-style: italic;
    color: var(--gold);
  }

  .hero-body {
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.8;
    color: var(--ink-muted);
    max-width: 420px;
    margin-bottom: 3rem;
  }

  .hero-actions {
    display: flex;
    gap: 1.5rem;
    align-items: center;
  }

  .btn-primary {
    display: inline-block;
    background: var(--ink);
    color: var(--cream);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 1rem 2.2rem;
    transition: background 0.2s, transform 0.15s;
  }

  .btn-primary:hover { background: var(--gold); transform: translateY(-1px); }

  .btn-ghost {
    display: inline-block;
    color: var(--ink-muted);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: color 0.2s;
  }

  .btn-ghost svg { transition: transform 0.2s; }
  .btn-ghost:hover { color: var(--ink); }
  .btn-ghost:hover svg { transform: translateX(4px); }

  .hero-right {
    position: relative;
    overflow: hidden;
    background: var(--ink-soft);
  }

  .hero-right-inner {
    position: absolute;
    inset: 0;
    background: 
      linear-gradient(135deg, rgba(184,153,90,0.15) 0%, transparent 50%),
      var(--ink-soft);
  }

  .hero-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 60px, rgba(255,255,255,1) 60px, rgba(255,255,255,1) 61px
    ), repeating-linear-gradient(
      90deg, transparent, transparent 60px, rgba(255,255,255,1) 60px, rgba(255,255,255,1) 61px
    );
  }

  .hero-stat-block {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 3rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: rgba(184,153,90,0.2);
  }

  .hero-stat {
    background: rgba(14,14,13,0.85);
    padding: 2rem;
    backdrop-filter: blur(4px);
  }

  .hero-stat-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3rem;
    font-weight: 300;
    color: var(--gold-light);
    line-height: 1;
    margin-bottom: 0.4rem;
  }

  .hero-stat-label {
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }

  .hero-center-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -60%);
    text-align: center;
  }

  .hero-center-text p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-style: italic;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.04em;
    line-height: 1.7;
    max-width: 280px;
  }

  /* ── MARQUEE ── */
  .marquee-strip {
    background: var(--gold);
    padding: 0.9rem 0;
    overflow: hidden;
    position: relative;
  }

  .marquee-track {
    display: flex;
    gap: 0;
    animation: marquee 30s linear infinite;
    white-space: nowrap;
  }

  .marquee-item {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    padding: 0 2.5rem;
    display: flex;
    align-items: center;
    gap: 2.5rem;
  }

  .marquee-item::after {
    content: '◆';
    font-size: 0.4rem;
    opacity: 0.5;
  }

  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ── SECTIONS ── */
  section { padding: 7rem 4rem; }

  .section-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .section-label::before {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: var(--gold);
  }

  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 3.5vw, 3.8rem);
    font-weight: 300;
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: 1.5rem;
  }

  .section-title em { font-style: italic; color: var(--gold); }

  /* ── ABOUT ── */
  .about {
    background: var(--white);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    padding: 0;
  }

  .about-left {
    padding: 7rem 5rem 7rem 4rem;
    border-right: 1px solid var(--rule);
  }

  .about-right {
    padding: 7rem 4rem 7rem 5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .about-body {
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.85;
    color: var(--ink-muted);
    margin-bottom: 2rem;
  }

  .about-body strong {
    font-weight: 500;
    color: var(--ink);
  }

  .about-pillars {
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
  }

  .pillar {
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
  }

  .pillar-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
    min-width: 2rem;
  }

  .pillar-content h3 {
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    color: var(--ink);
  }

  .pillar-content p {
    font-size: 0.9rem;
    font-weight: 300;
    line-height: 1.7;
    color: var(--ink-muted);
  }

  /* ── EXPERTISE ── */
  .expertise {
    background: var(--cream);
  }

  .expertise-header {
    max-width: 560px;
    margin-bottom: 5rem;
  }

  .expertise-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .expertise-card {
    background: var(--cream);
    padding: 2.5rem;
    transition: background 0.25s;
    position: relative;
    overflow: hidden;
  }

  .expertise-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--gold);
    transform: scaleX(0);
    transition: transform 0.3s ease;
    transform-origin: left;
  }

  .expertise-card:hover { background: var(--white); }
  .expertise-card:hover::before { transform: scaleX(1); }

  .expertise-icon {
    width: 40px;
    height: 40px;
    margin-bottom: 1.5rem;
    color: var(--gold);
  }

  .expertise-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 400;
    margin-bottom: 0.8rem;
    color: var(--ink);
  }

  .expertise-card p {
    font-size: 0.88rem;
    font-weight: 300;
    line-height: 1.75;
    color: var(--ink-muted);
  }

  .expertise-tag {
    display: inline-block;
    margin-top: 1.5rem;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    padding: 0.3rem 0.8rem;
    border: 1px solid var(--rule);
  }

  /* ── PROCESS ── */
  .process {
    background: var(--ink);
    color: var(--cream);
  }

  .process .section-title { color: var(--cream); }
  .process .section-label { color: var(--gold-light); }
  .process .section-label::before { background: var(--gold-light); }

  .process-layout {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 6rem;
    align-items: start;
    margin-top: 4rem;
  }

  .process-intro {
    font-size: 0.95rem;
    font-weight: 300;
    line-height: 1.85;
    color: rgba(250,248,243,0.55);
  }

  .process-steps {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .process-step {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 2rem;
    padding: 2.5rem 0;
    border-bottom: 1px solid rgba(184,153,90,0.15);
    position: relative;
  }

  .process-step:last-child { border-bottom: none; }

  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3rem;
    font-weight: 300;
    color: rgba(184,153,90,0.3);
    line-height: 1;
    transition: color 0.2s;
  }

  .process-step:hover .step-num { color: var(--gold); }

  .step-body h3 {
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--cream);
    margin-bottom: 0.6rem;
  }

  .step-body p {
    font-size: 0.88rem;
    font-weight: 300;
    line-height: 1.75;
    color: rgba(250,248,243,0.5);
  }

  /* ── ROLES ── */
  .roles {
    background: var(--cream-dark);
  }

  .roles-header {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    margin-bottom: 4rem;
    align-items: end;
  }

  .roles-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .role-card {
    background: var(--cream-dark);
    padding: 2rem 1.5rem;
    transition: background 0.2s;
  }

  .role-card:hover { background: var(--cream); }

  .role-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 0.4rem;
  }

  .role-level {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* ── SECTORS ── */
  .sectors {
    background: var(--white);
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 0;
  }

  .sectors-left {
    padding: 7rem 5rem 7rem 4rem;
    background: var(--white);
    border-right: 1px solid var(--rule);
  }

  .sectors-list {
    margin-top: 3rem;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .sectors-list li {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    padding: 1.2rem 0;
    border-bottom: 1px solid var(--rule);
    font-size: 0.92rem;
    font-weight: 300;
    color: var(--ink-muted);
    transition: color 0.2s;
    cursor: default;
  }

  .sectors-list li:hover { color: var(--ink); }

  .sectors-list li::before {
    content: '';
    display: block;
    width: 4px;
    height: 4px;
    background: var(--gold);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sectors-right {
    padding: 7rem 4rem 7rem 5rem;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .sectors-right .section-label { color: var(--gold-light); }
  .sectors-right .section-label::before { background: var(--gold-light); }

  .sectors-quote {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    font-style: italic;
    line-height: 1.5;
    color: var(--cream);
    margin: 2.5rem 0;
  }

  .sectors-quote span { color: var(--gold-light); }

  .sectors-note {
    font-size: 0.88rem;
    font-weight: 300;
    line-height: 1.75;
    color: rgba(250,248,243,0.45);
  }

  /* ── CONTACT ── */
  .contact {
    background: var(--cream);
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 0;
  }

  .contact-left {
    padding: 7rem 5rem 7rem 4rem;
    border-right: 1px solid var(--rule);
  }

  .contact-subtitle {
    font-size: 0.95rem;
    font-weight: 300;
    line-height: 1.85;
    color: var(--ink-muted);
    margin-top: 2rem;
    max-width: 400px;
  }

  .contact-details {
    margin-top: 3.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .contact-item {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .contact-item-label {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .contact-item-value {
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--ink);
    text-decoration: none;
  }

  .contact-item-value:hover { color: var(--gold); }

  .contact-right {
    padding: 7rem 4rem 7rem 5rem;
  }

  .contact-right h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    font-weight: 300;
    color: var(--ink);
    margin-bottom: 2.5rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .form-label {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .form-input {
    background: var(--white);
    border: 1px solid var(--rule);
    padding: 0.85rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 300;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .form-input:focus { border-color: var(--gold); }

  textarea.form-input { resize: vertical; min-height: 100px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  .form-submit {
    background: var(--ink);
    color: var(--cream);
    border: none;
    padding: 1rem 2.2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 0.5rem;
  }

  .form-submit:hover { background: var(--gold); }

  /* ── FOOTER ── */
  footer {
    background: var(--ink-soft);
    padding: 3rem 4rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(184,153,90,0.15);
  }

  .footer-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(250,248,243,0.6);
  }

  .footer-logo span { color: var(--gold); }

  .footer-tagline {
    font-size: 0.75rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: rgba(250,248,243,0.3);
  }

  .footer-copy {
    font-size: 0.72rem;
    color: rgba(250,248,243,0.25);
  }

  /* ── ANIMATIONS ── */
  .fade-up {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .fade-up.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .delay-1 { transition-delay: 0.1s; }
  .delay-2 { transition-delay: 0.2s; }
  .delay-3 { transition-delay: 0.3s; }
  .delay-4 { transition-delay: 0.4s; }
  .delay-5 { transition-delay: 0.5s; }

  /* ── FOUNDER ── */
  .founder {
    background: var(--white);
    padding: 0;
    border-top: 1px solid var(--rule);
  }

  .founder-inner {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 700px;
  }

  .founder-left {
    background: var(--ink);
    padding: 5rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    position: relative;
  }

  .founder-left .section-label {
    color: var(--gold-light);
  }

  .founder-left .section-label::before {
    background: var(--gold-light);
  }

  .founder-photo-placeholder {
    width: 100%;
    max-width: 240px;
    aspect-ratio: 3/4;
    overflow: hidden;
    margin: 0 auto;
    border: 1px solid rgba(184,153,90,0.2);
  }

  .founder-photo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
    filter: grayscale(15%);
    transition: filter 0.4s ease;
  }

  .founder-photo-img:hover {
    filter: grayscale(0%);
  }

  .founder-name-block {
    border-top: 1px solid rgba(184,153,90,0.15);
    padding-top: 2rem;
  }

  .founder-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    color: var(--cream);
    margin-bottom: 0.3rem;
  }

  .founder-title {
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--gold-light);
    letter-spacing: 0.04em;
    margin-bottom: 1.2rem;
    line-height: 1.5;
  }

  .founder-credentials {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .founder-credentials span {
    font-size: 0.72rem;
    font-weight: 300;
    color: rgba(250,248,243,0.35);
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 0.5rem;

<!-- PROCESS -->
<section class="process" id="process">
  <div class="section-label fade-up">How We Work</div>
  <h2 class="section-title fade-up delay-1">A disciplined<br><em>search methodology.</em></h2>
  <div class="process-layout">
    <div>
      <p class="process-intro">
        Executive search for PE-backed companies demands more than a database. It demands a proprietary process calibrated to holding periods, investment theses, and board dynamics. Here's how we operate.
      </p>
    </div>
    <div class="process-steps">
      <div class="process-step fade-up">
        <div class="step-num">01</div>
        <div class="step-body">
          <h3>Sponsor & Management Alignment</h3>
          <p>We start by aligning with both the PE sponsor and management team on the ideal candidate profile, success metrics, and cultural fit. Misalignment here kills searches — we prevent it upfront.</p>
        </div>
      </div>
      <div class="process-step fade-up delay-1">
        <div class="step-num">02</div>
        <div class="step-body">
          <h3>Proprietary Market Mapping</h3>
          <p>We conduct a systematic mapping of the relevant talent universe — including passive, non-networked candidates who would never surface through referrals alone.</p>
        </div>
      </div>
      <div class="process-step fade-up delay-2">
        <div class="step-num">03</div>
        <div class="step-body">
          <h3>Structured Evaluation & Screening</h3>
          <p>Competency-based interviews, SaaS metric fluency assessments, and PE culture fit evaluation. We only advance candidates who can perform in a sponsor-backed environment.</p>
        </div>
      </div>
      <div class="process-step fade-up delay-3">
        <div class="step-num">04</div>
        <div class="step-body">
          <h3>Presentation & Selection</h3>
          <p>Curated slate of 3–4 finalists with detailed written assessments. We facilitate structured panel interviews and guide both sides through the decision process.</p>
        </div>
      </div>
      <div class="process-step fade-up delay-4">
        <div class="step-num">05</div>
        <div class="step-body">
          <h3>Reference Verification & Close</h3>
          <p>Deep reference checks, offer negotiation support, and a 90-day onboarding check-in. We stay involved until the executive is set up to succeed.</p>
        </div>
      </div>
    </div>
  </div>
</section>

      <h2 class="section-title fade-up">Built from<br><em>experience.</em></h2>
      <div class="founder-bio">
        <p class="fade-up delay-1">Nancy is a veteran talent executive with more than 27 years of experience at the intersection of high-growth technology and human capital. Over the course of her career, she has reviewed more than 4 million resumes, coordinated hundreds of thousands of interviews, and placed thousands of professionals across every level of an organization — from first hires to chief executives.</p>
        <p class="fade-up delay-2">She founded Lumina Search Group to address a gap she observed repeatedly throughout her career: private equity and venture capital–backed software companies face uniquely high-stakes leadership decisions, yet are often underserved by generalist search firms that lack the technical fluency and PE ecosystem relationships to move with the speed and precision these environments demand.</p>
        <p class="fade-up delay-3">Before founding Lumina, Nancy served as CEO of PathMatch, a digital career navigation platform that matched college students with modern career paths and connected employers with emerging talent at scale. Under her leadership, PathMatch developed proprietary matching technology that helped students identify in-demand career trajectories while enabling companies to build early-career talent pipelines and strengthen their employer brands with the next generation of professionals.</p>
        <p class="fade-up delay-4">Prior to PathMatch, Nancy founded FILD, a technology-enabled recruiting firm that partnered with some of the most recognized names in tech — including Snap, Amazon, Warby Parker, and Netflix — to hire thousands of employees. FILD was acquired in 2018, a testament to the firm's operational excellence and the differentiated value of its approach.</p>
